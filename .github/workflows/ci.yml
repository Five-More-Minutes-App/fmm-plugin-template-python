name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest

  manifest:
    # The same check the registry runs on a pull request, so a mistake is found here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: five-more-minutes/fmm-plugin-registry
          path: registry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: registry
      - run: node registry/scripts/validate.mjs --manifest fmm-plugin.json
